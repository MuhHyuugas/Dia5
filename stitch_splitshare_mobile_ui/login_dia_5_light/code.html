            color: theme('colors.primary-container');

<body class="bg-white text-gray-900 min-h-screen flex flex-col antialiased selection:bg-primary-container/30">
<!-- Transactional layout: No Nav Shells -->
<main class="flex-1 flex flex-col items-center justify-center px-container-margin-mobile md:px-container-margin-desktop py-section-gap relative z-10">
<!-- Ambient subtle glow behind the form -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none overflow-hidden z-0">
<div class="w-[300px] h-[300px] bg-primary-container/5 rounded-full blur-[80px]"></div>
</div>
<div class="w-full max-w-sm flex flex-col gap-10 z-10">
<!-- Header -->
<header class="text-center flex flex-col items-center gap-stack-sm">
<img src="https://lh3.googleusercontent.com/aida/AP1WRLvN9tVxIXdvfY_djKHbJJs4JIaC7J2TyhfY7vpTPxbpkCgsxRiHmBGBqocTgNI4JmhbzKpr7Rdt9unuHu8evrlWWvYAJQAuC-EwlLi7g5uN79EcOUT0-ziTqmAc_YFuS6Xt3SLo2TSCoCdOI-4rYXStZtjw2xjOygUJeUmBEP-XgFsjr6isKS-yFF-Youkb93lvrlN8am1_F-QNrWgBBtRtJKWYir07ZTRThKzuFxk_XFuKLszjXrRnbUA" alt="Dia 5 Logo" class="h-12 w-auto object-contain">
<p class="font-body-md text-body-md text-gray-600">
                    Bem-vindo de volta.
                </p>
</header>
<!-- Login Form -->
<form class="flex flex-col gap-stack-lg w-full" onsubmit="event.preventDefault();">
<!-- Input Group: Email -->
<div class="input-highlight flex flex-col gap-stack-sm relative group">
<label class="font-label-caps text-label-caps text-gray-600 transition-colors uppercase" for="email">
                        E-mail
                    </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-gray-400 pointer-events-none group-focus-within:text-primary-container transition-colors" data-icon="mail">mail</span>
<input class="w-full bg-transparent border-0 border-b-2 border-gray-300 focus:border-primary-container focus:ring-0 pl-8 pr-0 py-2 font-body-md text-body-md text-gray-900 placeholder:text-gray-400 transition-colors" id="email" name="email" placeholder="seu@email.com" required="" type="email">
</div>
</div>
<!-- Input Group: Password -->
<div class="input-highlight flex flex-col gap-stack-sm relative group">
<div class="flex justify-between items-center w-full">
<label class="font-label-caps text-label-caps text-gray-600 transition-colors uppercase" for="password">
                            Senha
                        </label>
<a class="font-label-caps text-label-caps text-primary-container hover:text-primary-container/80 transition-colors" href="#">
                            Esqueci minha senha
                        </a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-gray-400 pointer-events-none group-focus-within:text-primary-container transition-colors" data-icon="lock">lock</span>
<input class="w-full bg-transparent border-0 border-b-2 border-gray-300 focus:border-primary-container focus:ring-0 pl-8 pr-0 py-2 font-body-md text-body-md text-gray-900 placeholder:text-gray-400 transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-stack-md mt-4">
<button class="w-full bg-primary-container text-white font-label-caps text-label-caps py-4 rounded-lg hover:bg-primary-container/90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-sm" type="submit">
<span class="">Entrar</span>
<span class="material-symbols-outlined text-[18px]" data-icon="login">login</span>
</button>
<div class="flex items-center gap-4 my-2">
<div class="h-px bg-gray-200 flex-1"></div>
<span class="font-label-caps text-label-caps text-gray-500">OU</span>
<div class="h-px bg-gray-200 flex-1"></div>
</div>
<button class="w-full border border-gray-300 text-gray-700 font-label-caps text-label-caps py-4 rounded-lg hover:bg-gray-50 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="password">password</span>
<span class="">Entrar com Código</span>
</button>
</div>
</form>
<!-- Footer Link -->
<div class="text-center mt-4">
<p class="font-body-md text-body-md text-gray-600">
                    Não tem uma conta? 
                    <a class="text-primary-container hover:text-primary-container/80 transition-colors font-semibold" href="#">
                        Criar uma conta
                    </a>
</p>
</div>
</div>
</main>


</body></html>
