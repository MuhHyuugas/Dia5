<style>
        body {
            background-color: #ffffff; /* Override dark mode background for this specific light mode screen */
            color: #000000;
        }
        
        .input-group {
            position: relative;
            margin-bottom: 2rem;
        }

        .input-group input {
            width: 100%;
            padding: 10px 0;
            font-size: 16px;
            color: #000;
            border: none;
            border-bottom: 2px solid #e5e7eb;
            outline: none;
            background: transparent;
            transition: border-color 0.3s;
        }

        .input-group label {
            position: absolute;
            top: 0;
            left: 0;
            padding: 10px 0;
            font-size: 16px;
            color: #6b7280;
            pointer-events: none;
            transition: 0.3s ease all;
        }

        .input-group input:focus,
        .input-group input:valid {
            border-bottom: 2px solid #7c3aed; /* Primary container color used as accent */
        }

        .input-group input:focus ~ label,
        .input-group input:valid ~ label {
            top: -20px;
            font-size: 12px;
            color: #7c3aed;
            font-weight: 600;
            letter-spacing: 0.05em;
        }
    </style>

<body class="min-h-screen flex flex-col antialiased">
<!-- Header (Transactional, minimal nav) -->
<header class="flex items-center justify-between px-container-margin-mobile md:px-container-margin-desktop h-16 w-full bg-white/80 backdrop-blur-xl border-b border-gray-100 shadow-sm top-0 sticky z-50">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-gray-100 rounded-full transition-colors active:scale-95 duration-150 ease-in-out">
<span class="material-symbols-outlined text-gray-700" data-icon="arrow_back">arrow_back</span>
</button>
<div class="h-8 flex items-center"><img src="https://lh3.googleusercontent.com/aida/AP1WRLvN9tVxIXdvfY_djKHbJJs4JIaC7J2TyhfY7vpTPxbpkCgsxRiHmBGBqocTgNI4JmhbzKpr7Rdt9unuHu8evrlWWvYAJQAuC-EwlLi7g5uN79EcOUT0-ziTqmAc_YFuS6Xt3SLo2TSCoCdOI-4rYXStZtjw2xjOygUJeUmBEP-XgFsjr6isKS-yFF-Youkb93lvrlN8am1_F-QNrWgBBtRtJKWYir07ZTRThKzuFxk_XFuKLszjXrRnbUA" alt="Dia 5 Logo" class="h-full w-auto object-contain"></div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-container-margin-mobile">
<div class="w-full max-w-md bg-white rounded-2xl shadow-[0_10px_30px_rgba(124,58,237,0.04)] p-8">
<div class="text-center mb-10">
<h2 class="font-display-lg-mobile text-display-lg-mobile text-gray-900 mb-2">Crie sua conta</h2>
<p class="font-body-md text-body-md text-gray-500">Comece a gerenciar suas despesas de forma inteligente.</p>
</div>
<form class="flex flex-col">
<div class="input-group">
<input id="fullName" required="" type="text">
<label for="fullName" class="">Nome Completo</label>
</div>
<div class="input-group">
<input id="email" required="" type="email">
<label for="email" class="">E-mail</label>
</div>
<div class="input-group">
<input id="password" required="" type="password">
<label for="password" class="">Senha</label>
</div>
<div class="input-group">
<input id="confirmPassword" required="" type="password">
<label for="confirmPassword" class="">Confirmar Senha</label>
</div>
<button class="w-full bg-[#7c3aed] text-white font-label-caps text-label-caps py-4 rounded-xl mt-4 hover:bg-[#6b21a8] transition-colors active:scale-95 duration-200 shadow-md" type="button">
                    Cadastrar
                </button>
</form>
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-gray-600">
                    Já tenho uma conta? 
                    <a class="text-[#7c3aed] font-semibold hover:underline decoration-2 underline-offset-4" href="#">Entrar</a>
</p>
</div>
</div>
</main>
